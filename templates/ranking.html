<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Tap Tap - Ranking Animado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo negro AFUERA del cuadro */
            background: #000000;
            overflow: hidden;
            width: 1080px;
            height: 1920px;
            font-family: 'Arial Black', sans-serif;
            position: relative;
        }

        /* UN SOLO CUADRO en la esquina superior derecha */
        #canvas-container {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 320px;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5),
                        0 10px 40px rgba(0, 0, 0, 0.8);
            /* Fondo verde DENTRO del cuadro para chroma key */
            background: #00ff00;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .posicion-indicador {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            opacity: 0.2;
            z-index: 5;
            font-family: 'Arial Black', sans-serif;
        }

        .pos-1 { top: 40px; left: 20px; color: #FFD700; }
        .pos-2 { top: 180px; left: 20px; color: #C0C0C0; }
        .pos-3 { top: 320px; left: 20px; color: #CD7F32; }

        .sin-usuarios {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFFFFF;
            font-size: 20px;
            text-align: center;
            z-index: 20;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <!-- UN SOLO CUADRO en la esquina superior derecha -->
    <div id="canvas-container">
        <div class="posicion-indicador pos-1">1</div>
        <div class="posicion-indicador pos-2">2</div>
        <div class="posicion-indicador pos-3">3</div>
        <div class="sin-usuarios" id="sinUsuarios">Esperando... 💪</div>
        <canvas id="canvas"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const socket = io();
        const sinUsuariosDiv = document.getElementById('sinUsuarios');

        // Configurar tamaño del canvas
        canvas.width = 320;
        canvas.height = 500;

        let pelotas = [];
        let particulas = [];
        let rankingActual = [];

        // ============ CLASE PELOTA ============
        class Pelota {
            constructor(posicion, usuario) {
                this.posicion = posicion;
                this.usuario = usuario;
                this.x = Math.random() * (canvas.width - 120) + 60;
                this.y = Math.random() * (canvas.height - 120) + 60;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.radio = 50;
                this.imagen = new Image();
                this.imagen.crossOrigin = "anonymous";
                this.imagen.src = usuario.avatar || '';
                this.coronaOffset = 0;
                this.coronaDirection = 1;
                this.escala = 1;
                this.escalaTarget = 1;
            }

            actualizar() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radio < 0) {
                    this.vx = Math.abs(this.vx);
                    this.x = this.radio;
                }
                if (this.x + this.radio > canvas.width) {
                    this.vx = -Math.abs(this.vx);
                    this.x = canvas.width - this.radio;
                }
                if (this.y - this.radio < 0) {
                    this.vy = Math.abs(this.vy);
                    this.y = this.radio;
                }
                if (this.y + this.radio > canvas.height) {
                    this.vy = -Math.abs(this.vy);
                    this.y = canvas.height - this.radio;
                }

                this.coronaOffset += 0.08 * this.coronaDirection;
                if (this.coronaOffset > 10 || this.coronaOffset < 0) {
                    this.coronaDirection *= -1;
                }

                this.escala += (this.escalaTarget - this.escala) * 0.1;
            }

            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.escala, this.escala);

                // Sombra
                ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;

                // Círculo base con gradiente
                const gradiente = ctx.createRadialGradient(0, 0, 5, 0, 0, this.radio);
                if (this.posicion === 1) {
                    gradiente.addColorStop(0, '#FFF8DC');
                    gradiente.addColorStop(0.7, '#FFD700');
                    gradiente.addColorStop(1, '#B8860B');
                } else if (this.posicion === 2) {
                    gradiente.addColorStop(0, '#FFFFFF');
                    gradiente.addColorStop(0.7, '#C0C0C0');
                    gradiente.addColorStop(1, '#808080');
                } else {
                    gradiente.addColorStop(0, '#FFE4C4');
                    gradiente.addColorStop(0.7, '#CD7F32');
                    gradiente.addColorStop(1, '#8B4513');
                }

                ctx.beginPath();
                ctx.arc(0, 0, this.radio, 0, Math.PI * 2);
                ctx.fillStyle = gradiente;
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.shadowColor = 'transparent';

                // Imagen del usuario
                if (this.imagen.complete && this.imagen.naturalWidth > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radio - 8, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.imagen, -this.radio + 8, -this.radio + 8, 
                                 (this.radio - 8) * 2, (this.radio - 8) * 2);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#333';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radio - 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 35px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const inicial = this.usuario.nickname ? this.usuario.nickname.charAt(0).toUpperCase() : '?';
                    ctx.fillText(inicial, 0, 0);
                }

                ctx.restore();

                // Corona para el Top 1
                if (this.posicion === 1) {
                    this.dibujarCorona();
                }

                // Número de posición
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 28px Arial Black';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.strokeText(`#${this.posicion}`, this.x, this.y + this.radio + 30);
                ctx.fillText(`#${this.posicion}`, this.x, this.y + this.radio + 30);

                // Nombre del usuario
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 16px Arial';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                const nombreCorto = this.usuario.nickname.length > 10 ? 
                    this.usuario.nickname.substring(0, 10) + '..' : this.usuario.nickname;
                ctx.strokeText(nombreCorto, this.x, this.y + this.radio + 50);
                ctx.fillText(nombreCorto, this.x, this.y + this.radio + 50);

                // Cantidad de taps
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 14px Arial';
                ctx.strokeText(`🔥 ${this.usuario.totalLikes || 0}`, this.x, this.y + this.radio + 68);
                ctx.fillText(`🔥 ${this.usuario.totalLikes || 0}`, this.x, this.y + this.radio + 68);
            }

            dibujarCorona() {
                const coronaY = -this.radio - 22 + this.coronaOffset;
                const tamano = 28;

                ctx.save();
                ctx.translate(this.x, coronaY);

                ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
                ctx.shadowBlur = 12;

                ctx.fillStyle = '#FFD700';
                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(-tamano, tamano * 0.6);
                ctx.lineTo(-tamano, -tamano * 0.3);
                ctx.lineTo(-tamano * 0.5, tamano * 0.1);
                ctx.lineTo(0, -tamano * 0.5);
                ctx.lineTo(tamano * 0.5, tamano * 0.1);
                ctx.lineTo(tamano, -tamano * 0.3);
                ctx.lineTo(tamano, tamano * 0.6);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.shadowColor = 'transparent';

                // Joyas de la corona
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.arc(0, tamano * 0.1, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#00FF00';
                ctx.beginPath();
                ctx.arc(-tamano * 0.5, tamano * 0.2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0000FF';
                ctx.beginPath();
                ctx.arc(tamano * 0.5, tamano * 0.2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // ============ CLASE PARTÍCULA ============
        class Particula {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.vida = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = color;
                this.tamano = Math.random() * 8 + 4;
                this.rotacion = Math.random() * Math.PI * 2;
                this.rotacionVel = (Math.random() - 0.5) * 0.3;
            }

            actualizar() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.vx *= 0.99;
                this.vida -= this.decay;
                this.rotacion += this.rotacionVel;
            }

            dibujar() {
                ctx.save();
                ctx.globalAlpha = this.vida;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotacion);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.tamano / 2, -this.tamano / 2, this.tamano, this.tamano);
                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }

        function crearExplosion(x, y) {
            const colores = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FF69B4'];
            for (let i = 0; i < 50; i++) {
                const color = colores[Math.floor(Math.random() * colores.length)];
                particulas.push(new Particula(x, y, color));
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function actualizarPelotas() {
            if (rankingActual.length > 0) {
                sinUsuariosDiv.style.display = 'none';
            } else {
                sinUsuariosDiv.style.display = 'block';
            }

            pelotas.forEach((pelota, index) => {
                if (rankingActual[index]) {
                    const nuevoUsuario = rankingActual[index];
                    const posicionAnterior = pelota.posicion;
                    pelota.usuario = nuevoUsuario;
                    pelota.posicion = index + 1;
                    
                    if (pelota.imagen.src !== nuevoUsuario.avatar) {
                        pelota.imagen = new Image();
                        pelota.imagen.crossOrigin = "anonymous";
                        pelota.imagen.src = nuevoUsuario.avatar || '';
                    }
                    
                    if (posicionAnterior !== pelota.posicion) {
                        pelota.escalaTarget = 1.3;
                        setTimeout(() => { pelota.escalaTarget = 1; }, 300);
                    }
                }
            });

            while (pelotas.length < rankingActual.length) {
                const index = pelotas.length;
                if (rankingActual[index]) {
                    pelotas.push(new Pelota(index + 1, rankingActual[index]));
                }
            }

            pelotas.splice(rankingActual.length);
        }

        function detectarColisiones() {
            for (let i = 0; i < pelotas.length; i++) {
                for (let j = i + 1; j < pelotas.length; j++) {
                    const p1 = pelotas[i];
                    const p2 = pelotas[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distancia = Math.sqrt(dx * dx + dy * dy);

                    if (distancia < p1.radio + p2.radio) {
                        const angulo = Math.atan2(dy, dx);
                        const velocidad1 = Math.sqrt(p1.vx * p1.vx + p1.vy * p1.vy);
                        const velocidad2 = Math.sqrt(p2.vx * p2.vx + p2.vy * p2.vy);

                        p1.vx = Math.cos(angulo) * velocidad2 * 0.8;
                        p1.vy = Math.sin(angulo) * velocidad2 * 0.8;
                        p2.vx = Math.cos(angulo + Math.PI) * velocidad1 * 0.8;
                        p2.vy = Math.sin(angulo + Math.PI) * velocidad1 * 0.8;

                        const overlap = (p1.radio + p2.radio - distancia) / 2;
                        p1.x -= Math.cos(angulo) * overlap;
                        p1.y -= Math.sin(angulo) * overlap;
                        p2.x += Math.cos(angulo) * overlap;
                        p2.y += Math.sin(angulo) * overlap;
                    }
                }
            }
        }

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            pelotas.forEach(pelota => {
                pelota.actualizar();
                pelota.dibujar();
            });

            detectarColisiones();

            particulas = particulas.filter(p => p.vida > 0);
            particulas.forEach(particula => {
                particula.actualizar();
                particula.dibujar();
            });

            requestAnimationFrame(animar);
        }

        // ============ EVENTOS SOCKET.IO ============
        socket.on('like', (data) => {
            const existing = rankingActual.find(u => u?.uniqueId === data.uniqueId);
            if (existing) {
                existing.totalLikes += data.likes;
                existing.nickname = data.nickname;
                if (data.avatar) existing.avatar = data.avatar;
            } else {
                rankingActual.push({
                    uniqueId: data.uniqueId,
                    nickname: data.nickname,
                    avatar: data.avatar,
                    totalLikes: data.likes
                });
            }

            rankingActual.sort((a, b) => b.totalLikes - a.totalLikes);

            const posicionesAnteriores = rankingActual.slice(0, 3).map(u => u?.uniqueId);
            rankingActual = rankingActual.slice(0, 3);

            actualizarPelotas();

            // Detectar cambios de posición para explosiones
            rankingActual.forEach((usuario, index) => {
                const posicionAnterior = posicionesAnteriores.indexOf(usuario.uniqueId);
                if (posicionAnterior !== -1 && posicionAnterior !== index) {
                    const pelota = pelotas[index];
                    if (pelota) {
                        crearExplosion(pelota.x, pelota.y);
                    }
                }
            });
        });

        socket.on('ranking-actualizado', (ranking) => {
            rankingActual = ranking.slice(0, 3);
            actualizarPelotas();
        });

        socket.on('cambio-posicion', (cambios) => {
            cambios.forEach(cambio => {
                console.log(`${cambio.nickname} ${cambio.tipo === 'subio' ? 'subió' : 'bajó'} de posición`);
            });
        });

        // Iniciar animación
        animar();

        // Solicitar ranking inicial
        socket.emit('solicitar-ranking');
    </script>
</body>
</html>
